version: "3.9"

services:
  # ── PostgreSQL with pgvector ───────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: financial_research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d financial_research"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Ollama (local LLM — optional, only needed when LLM_PROVIDER=ollama) ──
  # Start with:  docker compose --profile ollama up
  # Pull models: docker compose exec ollama ollama pull llama3.2
  #              docker compose exec ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if your host has NVIDIA drivers + container toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Migrations (runs once, then exits) ────────────────────────────────────
  migrate:
    build: .
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@db:5432/financial_research"
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  # ── FastAPI application ────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://user:password@db:5432/financial_research"
      # OpenAI (default)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
      # Ollama — set LLM_PROVIDER=ollama and point at the companion service
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
      VECTOR_DIMENSION: "${VECTOR_DIMENSION:-1536}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./sample_docs:/app/sample_docs:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: rebuild
          path: pyproject.toml

volumes:
  postgres_data:
  ollama_data:
